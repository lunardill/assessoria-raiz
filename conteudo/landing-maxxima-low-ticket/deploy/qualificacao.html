<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="images/qualificacao-01.png">
<title>Quase lá — Protocolo Visita Garantida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182420;
    --paper:#F5F4EE;
    --paper-line:#E4E1D6;
    --surface:#FFFFFF;
    --surface-line:#E3E7E2;
    --dark:#152119;
    --dark-line:#2B3B33;
    --text-on-dark:#EFF3EF;
    --muted-on-dark:#9FB3A9;
    --accent:#1F6F54;
    --accent-strong:#144C39;
    --accent-soft:#E1EFE6;
    --price:#B9812E;
    --price-soft:#F3E7D2;
    --negative:#A6503F;
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  img{ max-width:100%; display:block; }
  .container{ width:100%; max-width:640px; margin:0 auto; padding:0 24px; }


  main{ flex:1; display:flex; align-items:center; padding:48px 0; }
  main .container{ width:100%; }

  .logo-wrap{ text-align:center; margin:0 0 28px; }
  .logo-wrap img{ width:auto; max-width:280px; height:auto; margin:0 auto; }

  .progress-wrap{ max-width:480px; margin:0 auto 28px; }
  .progress-track{
    background:#B7DBC4; border-radius:999px; height:34px; overflow:hidden; position:relative;
  }
  .progress-fill{
    height:100%; background:var(--accent-strong); border-radius:999px 0 0 999px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:0 14px; min-width:fit-content;
  }
  .progress-label, .progress-pct{
    color:#fff; font-weight:700; font-size:.78rem; letter-spacing:.03em; text-transform:uppercase;
    white-space:nowrap; font-family:var(--font-body);
  }
  .warning-title{
    font-family:var(--font-body); font-weight:700; font-size:clamp(1.2rem,3.6vw,1.5rem);
    color:#B3261C; text-align:center; text-transform:uppercase;
    margin:0 0 14px; text-wrap:balance;
  }
  .warning-body{
    text-align:center; font-size:1.1rem; color:var(--ink); margin:0 0 28px;
    max-width:46ch; margin-inline:auto;
  }

  .form-card{
    background:var(--surface);
    border:1px solid var(--surface-line);
    border-radius:16px;
    padding:32px 28px;
  }
  .field{ margin-bottom:20px; }
  .field label{
    display:block; font-weight:600; font-size:.94rem; margin-bottom:8px; color:var(--ink);
  }
  .field select, .field input[type="text"], .field input[type="tel"], .field input[type="email"]{
    width:100%; font-family:var(--font-body); font-size:1rem;
    padding:13px 14px; border-radius:8px; border:1px solid var(--surface-line);
    background:var(--paper); color:var(--ink);
  }
  .field select:focus, .field input:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; width:100%;
    gap:8px; font-family:var(--font-mono); font-weight:600; font-size:.86rem;
    letter-spacing:.06em; text-transform:uppercase;
    padding:17px 28px; border-radius:8px; border:none; cursor:pointer;
    background:linear-gradient(180deg,#3DCB65 0%, #1FA347 100%);
    color:#fff; box-shadow:0 10px 24px -10px rgba(20,76,57,.55);
  }
  .btn:disabled{ opacity:.65; cursor:default; }
  .form-error{ color:var(--negative); font-size:.86rem; margin-top:12px; display:none; }
  .form-error.show{ display:block; }

  footer{ background:var(--dark); color:var(--muted-on-dark); padding:26px 0; text-align:center; font-size:.78rem; }
  footer a{ color:var(--muted-on-dark); }
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KDBRK7ZH"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->


  <main>
    <div class="container">

      <div class="logo-wrap">
        <img src="images/qualificacao-02.png" alt="Protocolo Visita Garantida">
      </div>

      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-fill" style="width:92%">
            <span class="progress-label">Quase concluído!</span>
            <span class="progress-pct">92%</span>
          </div>
        </div>
      </div>

      <h2 class="warning-title">Atenção, não pule essa etapa.</h2>
      <p class="warning-body">Você precisa preencher as respostas abaixo para acessar o Protocolo Visita Garantida.</p>

      <form class="form-card" id="qualForm">
        <div class="field">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome completo" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" autocomplete="tel" required>
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="voce@email.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="temLoja">Você possui uma loja de carros?</label>
          <select id="temLoja" name="temLoja" required>
            <option value="" disabled selected>Selecione uma opção</option>
            <option value="Sim">Sim</option>
            <option value="Não">Não</option>
          </select>
        </div>
        <div class="field">
          <label for="instagram">Qual o @Instagram da sua loja?</label>
          <input type="text" id="instagram" name="instagram" placeholder="@sualoja" autocomplete="off" required>
        </div>
        <button type="submit" class="btn" id="submitBtn">Confirmar e liberar meu acesso</button>
        <p class="form-error" id="formError">Não conseguimos enviar agora. Tenta de novo em alguns segundos.</p>
      </form>

    </div>
  </main>

  <footer>
    <div class="container">
      Dúvidas? Contato: contato@assessoriaraiz.com.br
    </div>
  </footer>

<script>
  // Cole aqui a URL do Apps Script Web App (Implantar > Nova implantação > App da Web)
  // depois de publicar o script que grava as respostas na planilha.
  var ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbz7S-TMQcdwL2PCTmNaRcSc3d_gyo6G27uqJDpGXTTlkBsA7WJdaUaQwMRI7P3bg4NcvA/exec";

  // Página final, mostrada depois que a pessoa responde o formulário.
  var PROXIMA_PAGINA = "obrigado.html";

  var form = document.getElementById('qualForm');
  var submitBtn = document.getElementById('submitBtn');
  var formError = document.getElementById('formError');

  // Avisa o GTM assim que a pessoa toca no primeiro campo do formulário,
  // antes mesmo de terminar de preencher. Só dispara uma vez.
  var jaAvisouInicioForm = false;
  form.addEventListener('focusin', function(){
    if (jaAvisouInicioForm) return;
    jaAvisouInicioForm = true;
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ 'event': 'qualificacao_form_iniciada' });
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    formError.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Aguarde...';

    var payload = {
      nome: document.getElementById('nome').value.trim(),
      telefone: document.getElementById('telefone').value.trim(),
      email: document.getElementById('email').value.trim(),
      temLoja: document.getElementById('temLoja').value,
      instagram: document.getElementById('instagram').value.trim(),
      pagina: 'qualificacao-protocolo-visita-garantida',
      enviadoEm: new Date().toISOString()
    };

    function irParaProximaPagina(){
      window.location.href = PROXIMA_PAGINA;
    }

    if(!ENDPOINT_URL || ENDPOINT_URL.indexOf('COLE_AQUI') === 0){
      // Endpoint ainda não configurado — não trava o comprador, só avisa no console.
      console.warn('ENDPOINT_URL do Apps Script ainda não configurado em obrigado.html');
      irParaProximaPagina();
      return;
    }

    fetch(ENDPOINT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight de CORS
      body: JSON.stringify(payload)
    })
    .then(function(){ irParaProximaPagina(); })
    .catch(function(){ irParaProximaPagina(); }); // Apps Script não devolve CORS legível; tratamos como sucesso se a chamada saiu.
  });
</script>

</body>
</html>
